services:
  node1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node1
    environment:
      NODE_ID: node1
      PORT: "8080"
      MODE: ${MODE}
      IS_LEADER: "true"
      SELF_URL: http://node1:8080
      LEADER_URL: http://node1:8080
      N: "5"
      R: ${R}
      W: ${W}
      NODES: http://node1:8080,http://node2:8080,http://node3:8080,http://node4:8080,http://node5:8080
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 5s
      timeout: 2s
      retries: 20
      start_period: 5s

