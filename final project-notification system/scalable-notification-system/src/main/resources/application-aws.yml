spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?useSSL=false&serverTimezone=UTC
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP_ID:notification-requested-consumer-group}
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        linger.ms: 5
        batch.size: 65536
        compression.type: lz4

server:
  port: ${SERVER_PORT:8080}

app:
  kafka:
    notification-requested-consumer-concurrency: 4
  topics:
    notification-requested: notification.requested
    email-send: notification.email.send
    inapp-send: notification.inapp.send

  outbox:
    publisher:
      enabled: true
      batch-size: 1000
      max-batches-per-run: 20
      fixed-delay-ms: 50

  providers:
    email:
      simulated-latency-ms: 100
    inapp:
      simulated-latency-ms: 20
