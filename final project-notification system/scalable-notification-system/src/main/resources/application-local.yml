spring:
  datasource:
    url: jdbc:mysql://localhost:3307/notification_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-requested-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: 1
      properties:
        linger.ms: 5
        batch.size: 65536
        compression.type: lz4

server:
  port: 8080

app:
  kafka:
    notification-requested-consumer-concurrency: 4
  topics:
    notification-requested: notification.requested
    email-send: notification.email.send
    inapp-send: notification.inapp.send

  outbox:
    publisher:
      enabled: true
      batch-size: 1000
      max-batches-per-run: 20
      fixed-delay-ms: 50

  providers:
    email:
      simulated-latency-ms: 100
    inapp:
      simulated-latency-ms: 20