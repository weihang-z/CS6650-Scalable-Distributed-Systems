spring:
  datasource:
    url: jdbc:mysql://localhost:3307/notification_db?useSSL=false&serverTimezone=UTC
    username: root
    password: root

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notification-requested-consumer-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

server:
  port: 8080

app:
  topics:
    notification-requested: notification.requested
    email-send: notification.email.send
    inapp-send: notification.inapp.send

  outbox:
    publisher:
      enabled: true
      batch-size: 100
      fixed-delay-ms: 2000